name: Build APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_REPO: ${{ secrets.RELEASE_REPO }}   # optional: a public repo to hand out the APK from
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run the unit tests
        continue-on-error: true   # a failing test is shown but does not stop the APK
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon

      - name: Prepare signing key (if you added the secrets)
        id: sign
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "$KS" | base64 -d > android/bn-release.jks
            printf 'storeFile=bn-release.jks\nstorePassword=%s\nkeyAlias=bn\nkeyPassword=%s\n' "$PW" "$PW" > android/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets found: building a TEST (debug) APK instead."
          fi

      - name: Build
        working-directory: android
        env:
          BN_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../bn.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../bn.apk
          fi

      - name: Save the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: bn-apk
          path: bn.apk
          retention-days: 30

      - name: Publish the APK as a GitHub release (signed builds)
        if: ${{ steps.sign.outputs.signed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" bn.apk \
            --title "bn build ${{ github.run_number }}" \
            --notes "Signed APK. Install it over the old one. Do not uninstall first, or you lose your credits." \
            --latest || gh release upload "$TAG" bn.apk --clobber

      - name: Also publish to your public download repo (only if you added the two secrets)
        if: ${{ steps.sign.outputs.signed == 'true' && env.RELEASE_REPO != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" bn.apk \
            --repo "$RELEASE_REPO" \
            --title "bn build ${{ github.run_number }}" \
            --notes "Install over the old version. Do not uninstall first." \
            --latest || gh release upload "$TAG" bn.apk --repo "$RELEASE_REPO" --clobber
